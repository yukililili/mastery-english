<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastery English · 艾宾浩斯抗遗忘工作台</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-green: #2d6a4f;
      --light-green: #40916c;
      --bg-body: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #4b5563;
      --text-muted: #6b7280;
      --border-dashed: #b7d5be;
      --border-light: #e5e7eb;
      --accent-red: #dc2626;
      --accent-purple: #7c3aed;
      --accent-amber: #d97706;
      --accent-blue: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      padding-bottom: 60px;
    }

    /* 顶部导航与控制栏 */
    .nav-header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      z-index: 100;
      padding: 10px 16px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stage-switch { display: flex; gap: 6px; }
    .stage-btn {
      border: none;
      background: #e2e8f0;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 16px;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s;
    }
    .stage-btn.active { background: #1e293b; color: #ffffff; }

    .right-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .review-filter-btn {
      border: 1px solid #f59e0b;
      background: #fffbeb;
      color: #b45309;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .review-filter-btn.active {
      background: #f59e0b;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3);
    }

    .voice-picker-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 16px;
      border: 1px solid var(--border-light);
    }
    .voice-picker-wrap label { font-size: 0.78rem; font-weight: 700; color: var(--text-sub); }
    .voice-select {
      background: transparent;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
      max-width: 160px;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    .tab-scroll-box {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      justify-content: flex-start;
    }
    .tab-scroll-box::-webkit-scrollbar { display: none; }

    .tab-chip {
      white-space: nowrap;
      border: 1px solid var(--border-light);
      background: #ffffff;
      padding: 7px 15px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-sub);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .tab-chip.active {
      background: var(--primary-green);
      color: #ffffff;
      border-color: var(--primary-green);
      box-shadow: 0 2px 8px rgba(45, 106, 79, 0.2);
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 20px auto 0;
      padding: 0 16px;
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ================= 艾宾浩斯复习底栏 ================= */
    .ebbinghaus-bar {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ebbinghaus-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .status-badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
    }
    .status-due { background: #fee2e2; color: #b91c1c; }
    .status-learning { background: #e0e7ff; color: #4338ca; }
    .status-mastered { background: #dcfce7; color: #15803d; }

    .ebbinghaus-actions { display: flex; gap: 6px; }
    .btn-ebh {
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-forget { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-forget:hover { background: #fee2e2; }
    .btn-remember { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .btn-remember:hover { background: #dcfce7; }

    /* ================= 模块 1：词汇与翻卡功能 ================= */
    .vocab-wrapper {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    }

    .vocab-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .category-badge {
      display: inline-block;
      background-color: var(--primary-green);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 999px;
    }

    .flashcard-toggle-btn {
      border: 1px solid var(--primary-green);
      background: #f0fdf4;
      color: var(--primary-green);
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .flashcard-toggle-btn.active {
      background: var(--primary-green);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(45, 106, 79, 0.25);
    }

    .vocab-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

    .vocab-item {
      display: flex;
      flex-direction: column;
      padding: 18px;
      background: #fafbfa;
      border-radius: 14px;
      border: 1px dashed var(--border-dashed);
      gap: 10px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
      cursor: pointer;
      user-select: none;
    }
    .vocab-item:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(45, 106, 79, 0.08);
    }

    .vocab-main-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .vocab-content { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    
    .word-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .index-num {
      background-color: var(--primary-green);
      color: #ffffff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
    }
    
    .word-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .word-title:hover { color: var(--primary-green); }

    .word-meta {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary-green);
    }

    /* 翻卡折叠核心样式 */
    .flashcard-reveal-cue {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #0d9488;
      background: #ecfeff;
      padding: 4px 10px;
      border-radius: 8px;
      margin-top: 4px;
      margin-left: 30px;
      border: 1px dashed #a5f3fc;
    }

    .vocab-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.25s ease;
    }

    .flashcard-mode .vocab-item:not(.revealed) .vocab-details,
    .flashcard-mode .vocab-item:not(.revealed) .word-meta,
    .flashcard-mode .vocab-item:not(.revealed) .vocab-img-wrap {
      display: none !important;
    }

    .flashcard-mode .vocab-item.revealed .flashcard-reveal-cue {
      display: none;
    }

    .phonetic {
      font-size: 0.9rem;
      color: var(--primary-green);
      margin-left: 30px;
    }

    .sentence-en {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 4px;
      margin-left: 30px;
      line-height: 1.35;
    }
    .sentence-en:hover { color: var(--light-green); }

    .sentence-zh {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-left: 30px;
    }

    .vocab-img-wrap {
      width: 84px;
      height: 84px;
      background-color: #f2f5f2;
      border-radius: 10px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .vocab-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

    /* 模块 2：生活口语 */
    .daily-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .daily-card { background: var(--card-bg); border-radius: 16px; padding: 18px; border: 1px solid var(--border-light); }
    .scene-tag { display: inline-block; background: #ecfeff; color: #0891b2; font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-bottom: 10px; }
    .dialogue-flow { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .dialogue-bubble { padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; line-height: 1.45; cursor: pointer; }
    .speaker-a { background: #f1f5f9; align-self: flex-start; border-left: 3px solid #64748b; }
    .speaker-b { background: #e6fffa; align-self: flex-start; border-left: 3px solid #0d9488; }
    .nuance-tip { background: #fffbeb; border-radius: 8px; padding: 9px 12px; font-size: 0.85rem; color: #92400e; }

    /* 模块 3：职场沟通 */
    .work-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .work-card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-light); display: flex; flex-direction: column; gap: 12px; }
    .work-header { display: flex; justify-content: space-between; align-items: center; }
    .work-badge { background: #f3e8ff; color: #7e22ce; font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .contrast-box { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .direct-bad { background: #fff1f2; border-left: 3px solid #f43f5e; padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 0.9rem; color: #9f1239; }
    .pro-good { background: #f0fdf4; border-left: 3px solid #22c55e; padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 0.95rem; font-weight: 600; color: #15803d; cursor: pointer; }
    .work-formula { background: #f8fafc; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; color: var(--text-sub); }

    /* 模块 4：雅思口语 */
    .ielts-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
    .ielts-card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-light); }
    .ielts-badge { display: inline-block; background: #e0f2fe; color: #0369a1; font-size: 0.8rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-bottom: 10px; }
    .prompt-box { font-size: 1.1rem; font-weight: 750; margin-bottom: 12px; cursor: pointer; }
    .ielts-script { background: #f8fafc; padding: 14px; border-radius: 10px; line-height: 1.6; font-size: 0.95rem; margin-bottom: 12px; cursor: pointer; }
    .chunk-highlight { background: #fef08a; color: #854d0e; font-weight: 600; padding: 1px 4px; border-radius: 4px; }
    .chunk-list { background: #fffbeb; border-left: 4px solid #f59e0b; padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 0.85rem; color: #92400e; }

    /* 模块 5：商业破局 */
    .biz-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
    .biz-card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-light); display: flex; flex-direction: column; gap: 10px; }
    .biz-tag-trap { display: inline-block; background: #fee2e2; color: var(--accent-red); font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
    .biz-tag-strategy { display: inline-block; background: #ecfdf5; color: var(--primary-green); font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
    .biz-question-box { background: #fff5f5; border-left: 3px solid var(--accent-red); padding: 10px 12px; font-size: 0.9rem; font-weight: 600; color: #991b1b; }
    .biz-response-box { background: #f8fafc; border-left: 3px solid var(--primary-green); padding: 12px 14px; font-size: 0.95rem; line-height: 1.55; cursor: pointer; }
    .biz-punchline { background: #1e293b; color: #f8fafc; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; margin-top: auto; }

    /* 模块 6：TED 演说 */
    .ted-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
    .ted-card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-light); }
    .ted-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #f3f4f6; padding-bottom: 8px; }
    .ted-speaker { font-weight: 800; color: var(--accent-red); }
    .ted-split-layout { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .ted-script { background: #fdf2f2; border-left: 3px solid var(--accent-red); padding: 12px 14px; line-height: 1.55; font-size: 0.95rem; cursor: pointer; }
    .analysis-section { background: #f9fafb; border-radius: 8px; padding: 12px; font-size: 0.85rem; }
    .tag-badge { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; }
    .tag-exp { background: #dbeafe; color: #1e40af; }
    .tag-strat { background: #fef3c7; color: #92400e; }
    .tag-trans { background: #dcfce7; color: #166534; }

    .loading-hint { text-align: center; color: var(--text-muted); padding: 40px 0; }

    @media (min-width: 768px) {
      .nav-container { flex-direction: row; justify-content: space-between; align-items: center; }
      .tab-scroll-box { justify-content: flex-end; }
      .vocab-grid, .daily-grid, .work-grid, .ielts-grid, .biz-grid { grid-template-columns: repeat(2, 1fr); }
      .ted-split-layout, .contrast-box { grid-template-columns: 1fr 1fr; }
      .voice-select { max-width: 200px; }
    }
    @media (min-width: 1024px) {
      .vocab-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <header class="nav-header">
    <div class="nav-container">
      <div class="top-control-bar">
        <div class="stage-switch">
          <button class="stage-btn active" onclick="filterTabs('all')">全部</button>
          <button class="stage-btn" onclick="filterTabs('practical')">日常实战</button>
          <button class="stage-btn" onclick="filterTabs('advanced')">高阶进阶</button>
        </div>

        <div class="right-tools">
          <button id="reviewFilterBtn" class="review-filter-btn" onclick="toggleReviewOnly()">
            🔔 今日待复习 (<span id="dueCount">0</span>)
          </button>

          <div class="voice-picker-wrap">
            <label for="voiceSelect">🔊</label>
            <select id="voiceSelect" class="voice-select" onchange="onVoiceChange()">
              <option value="">加载音色中...</option>
            </select>
          </div>
        </div>
      </div>

      <div class="tab-scroll-box">
        <button class="tab-chip active" data-stage="practical" onclick="switchTab('vocab')">词汇语块</button>
        <button class="tab-chip" data-stage="practical" onclick="switchTab('daily')">生活口语</button>
        <button class="tab-chip" data-stage="practical" onclick="switchTab('work')">职场沟通</button>
        <button class="tab-chip" data-stage="advanced" onclick="switchTab('ielts')">雅思口语</button>
        <button class="tab-chip" data-stage="advanced" onclick="switchTab('biz')">商业破局</button>
        <button class="tab-chip" data-stage="advanced" onclick="switchTab('ted')">TED演说</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="pane-vocab" class="tab-pane active flashcard-mode">
      <div class="vocab-wrapper">
        <div class="vocab-header-row">
          <div class="category-badge" id="vocabCategory">词汇语块</div>
          <button id="flashcardToggleBtn" class="flashcard-toggle-btn active" onclick="toggleFlashcardMode()">
            🃏 翻卡自测模式: 已开启
          </button>
        </div>
        <div class="vocab-grid" id="vocabContainer"><div class="loading-hint">正在读取 data/vocab.json ...</div></div>
      </div>
    </section>

    <section id="pane-daily" class="tab-pane">
      <div class="daily-grid" id="dailyContainer"><div class="loading-hint">正在读取 data/daily.json ...</div></div>
    </section>

    <section id="pane-work" class="tab-pane">
      <div class="work-grid" id="workContainer"><div class="loading-hint">正在读取 data/work.json ...</div></div>
    </section>

    <section id="pane-ielts" class="tab-pane">
      <div class="ielts-grid" id="ieltsContainer"><div class="loading-hint">正在读取 data/ielts.json ...</div></div>
    </section>

    <section id="pane-biz" class="tab-pane">
      <div class="biz-grid" id="bizContainer"><div class="loading-hint">正在读取 data/biz.json ...</div></div>
    </section>

    <section id="pane-ted" class="tab-pane">
      <div class="ted-grid" id="tedContainer"><div class="loading-hint">正在读取 data/ted.json ...</div></div>
    </section>
  </main>

  <script>
    const EBBINGHAUS_DAYS = [0, 1, 2, 4, 7, 15, 30];
    let isReviewOnly = false;
    let isFlashcardMode = true; // 默认开启翻卡自测模式

    function getMemoryStore() {
      try {
        return JSON.parse(localStorage.getItem('ebbinghaus_memory_v1') || '{}');
      } catch (e) { return {}; }
    }

    function saveMemoryStore(store) {
      localStorage.setItem('ebbinghaus_memory_v1', JSON.stringify(store));
      updateDueCount();
    }

    function getCardKey(module, item, idx) {
      if (module === 'vocab') return `vocab_${item.word || idx}`;
      if (module === 'daily') return `daily_${item.scene || idx}`;
      if (module === 'work') return `work_${item.topic || idx}`;
      if (module === 'ielts') return `ielts_${item.question?.substring(0, 15) || idx}`;
      if (module === 'biz') return `biz_${item.trap?.substring(0, 15) || idx}`;
      if (module === 'ted') return `ted_${item.title?.substring(0, 15) || idx}`;
      return `${module}_${idx}`;
    }

    function getCardEbhStatus(cardKey) {
      const store = getMemoryStore();
      const record = store[cardKey] || { level: 0, nextReview: 0 };
      const now = Date.now();
      const isDue = record.nextReview <= now;

      let badgeHtml = '';
      if (record.level === 0) {
        badgeHtml = `<span class="status-badge status-due">Lv.0 待学习</span>`;
      } else if (record.level >= 6) {
        badgeHtml = `<span class="status-badge status-mastered">Lv.6 已掌握 ⭐</span>`;
      } else if (isDue) {
        badgeHtml = `<span class="status-badge status-due">Lv.${record.level} 今日待复习</span>`;
      } else {
        const remainingDays = Math.ceil((record.nextReview - now) / (1000 * 60 * 60 * 24));
        badgeHtml = `<span class="status-badge status-learning">Lv.${record.level} (${remainingDays}天后复习)</span>`;
      }

      return { record, isDue, badgeHtml };
    }

    function reviewCard(module, cardKey, remembered, evt) {
      if (evt) evt.stopPropagation(); // 避免触发翻卡事件
      const store = getMemoryStore();
      const current = store[cardKey] || { level: 0, nextReview: 0 };
      const now = Date.now();

      if (remembered) {
        const nextLevel = Math.min(current.level + 1, 6);
        const daysToAdd = EBBINGHAUS_DAYS[nextLevel];
        const nextReviewTime = now + (daysToAdd * 24 * 60 * 60 * 1000);
        store[cardKey] = { level: nextLevel, nextReview: nextReviewTime, lastReview: now };
      } else {
        store[cardKey] = { level: 0, nextReview: now, lastReview: now };
      }

      saveMemoryStore(store);
      renderModule(module);
    }

    function renderEbhBar(module, cardKey) {
      const { badgeHtml } = getCardEbhStatus(cardKey);
      return `
        <div class="ebbinghaus-bar">
          <div class="ebbinghaus-status">
            <span>记忆进度:</span>
            ${badgeHtml}
          </div>
          <div class="ebbinghaus-actions">
            <button class="btn-ebh btn-forget" onclick="reviewCard('${module}', '${cardKey}', false, event)">❌ 模糊/重背</button>
            <button class="btn-ebh btn-remember" onclick="reviewCard('${module}', '${cardKey}', true, event)">✅ 记住了</button>
          </div>
        </div>
      `;
    }

    function getModuleList(name) {
      const data = appData[name];
      if (!data) return [];
      if (Array.isArray(data)) return data;
      if (Array.isArray(data.items)) return data.items;
      return [];
    }

    function updateDueCount() {
      const store = getMemoryStore();
      const now = Date.now();
      let due = 0;

      ['vocab', 'daily', 'work', 'ielts', 'biz', 'ted'].forEach(modKey => {
        const items = getModuleList(modKey);
        items.forEach((item, idx) => {
          const key = getCardKey(modKey, item, idx);
          const record = store[key];
          if (!record || record.nextReview <= now) {
            due++;
          }
        });
      });

      document.getElementById('dueCount').textContent = due;
    }

    function toggleReviewOnly() {
      isReviewOnly = !isReviewOnly;
      const btn = document.getElementById('reviewFilterBtn');
      btn.classList.toggle('active', isReviewOnly);
      const activePane = document.querySelector('.tab-pane.active');
      if (activePane) {
        const modKey = activePane.id.replace('pane-', '');
        renderModule(modKey);
      }
    }

    // 翻卡模式全局切换
    function toggleFlashcardMode() {
      isFlashcardMode = !isFlashcardMode;
      const pane = document.getElementById('pane-vocab');
      const btn = document.getElementById('flashcardToggleBtn');

      if (isFlashcardMode) {
        pane.classList.add('flashcard-mode');
        btn.classList.add('active');
        btn.innerHTML = '🃏 翻卡自测模式: 已开启';
      } else {
        pane.classList.remove('flashcard-mode');
        btn.classList.remove('active');
        btn.innerHTML = '📖 列表全览模式';
      }
    }

    // 单张卡片点击翻开/收起
    function toggleCardReveal(cardElement, evt) {
      if (evt && (evt.target.closest('.ebbinghaus-bar') || evt.target.closest('.word-title'))) {
        return; // 点击音频或复习按钮时不触发折叠
      }
      if (isFlashcardMode) {
        cardElement.classList.toggle('revealed');
      }
    }

    const appData = {};

    async function loadModule(name) {
      try {
        const res = await fetch(`./data/${name}.json`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        appData[name] = await res.json();
        renderModule(name);
        updateDueCount();
      } catch (err) {
        console.warn(`未检测到 ./data/${name}.json`, err);
        const container = document.getElementById(`${name}Container`);
        if (container) {
          container.innerHTML = `<div class="loading-hint">请在 GitHub 的 data/${name}.json 中上传内容</div>`;
        }
      }
    }

    function renderModule(name) {
      let items = getModuleList(name);

      // 1. 词汇模块
      if (name === 'vocab' && appData.vocab) {
        const title = Array.isArray(appData.vocab) ? '词汇语块' : (appData.vocab.category || '词汇语块');
        document.getElementById('vocabCategory').textContent = title;
        
        if (isReviewOnly) {
          items = items.filter((item, idx) => getCardEbhStatus(getCardKey('vocab', item, idx)).isDue);
        }

        if (items.length === 0) {
          document.getElementById('vocabContainer').innerHTML = isReviewOnly
            ? `<div class="loading-hint">🎉 太棒了！词汇模块今日已全部复习完毕！</div>`
            : `<div class="loading-hint">暂无词汇数据</div>`;
          return;
        }

        document.getElementById('vocabContainer').innerHTML = items.map((item, idx) => {
          const cardKey = getCardKey('vocab', item, idx);
          return `
            <div class="vocab-item" onclick="toggleCardReveal(this, event)">
              <div class="vocab-main-row">
                <div class="vocab-content">
                  <div class="word-row">
                    <span class="index-num">${item.id || (idx + 1)}</span>
                    <span class="word-title" onclick="playVoice('vocab', ${idx}, 'word', event)">${item.word} 🔊</span>
                    <span class="word-meta">${item.pos || ''}（${item.meaning || ''}）</span>
                  </div>
                  <div class="flashcard-reveal-cue">👆 点击卡片翻看 释义与例句</div>
                  <div class="vocab-details">
                    <div class="phonetic">${item.phonetic || ''}</div>
                    <div class="sentence-en" onclick="playVoice('vocab', ${idx}, 'sentence', event)">${item.sentence || ''} 🔊</div>
                    <div class="sentence-zh">（${item.translation || ''}）</div>
                  </div>
                </div>
                ${item.image ? `<div class="vocab-img-wrap"><img src="${item.image}" alt="${item.word}" loading="lazy"></div>` : ''}
              </div>
              ${renderEbhBar('vocab', cardKey)}
            </div>
          `;
        }).join('');
      }

      // 2. 生活口语
      if (name === 'daily' && appData.daily) {
        if (isReviewOnly) {
          items = items.filter((item, idx) => getCardEbhStatus(getCardKey('daily', item, idx)).isDue);
        }
        if (items.length === 0) {
          document.getElementById('dailyContainer').innerHTML = isReviewOnly
            ? `<div class="loading-hint">🎉 太棒了！生活口语今日已全部复习完毕！</div>`
            : `<div class="loading-hint">暂无数据</div>`;
          return;
        }

        document.getElementById('dailyContainer').innerHTML = items.map((item, idx) => {
          const cardKey = getCardKey('daily', item, idx);
          return `
            <div class="daily-card">
              <div class="scene-tag">场景：${item.scene}</div>
              <div class="dialogue-flow">
                <div class="dialogue-bubble speaker-a" onclick="playVoice('daily', ${idx}, 'speakerA', event)">
                  <strong>A:</strong> ${item.speakerA} 🔊
                  <div style="color: var(--text-sub); font-size: 0.85rem; margin-top: 4px;">${item.speakerAZh}</div>
                </div>
                <div class="dialogue-bubble speaker-b" onclick="playVoice('daily', ${idx}, 'speakerB', event)">
                  <strong>B:</strong> ${item.speakerB} 🔊
                  <div style="color: var(--text-sub); font-size: 0.85rem; margin-top: 4px;">${item.speakerBZh}</div>
                </div>
              </div>
              <div class="nuance-tip">${item.tip}</div>
              ${renderEbhBar('daily', cardKey)}
            </div>
          `;
        }).join('');
      }

      // 3. 职场沟通
      if (name === 'work' && appData.work) {
        if (isReviewOnly) {
          items = items.filter((item, idx) => getCardEbhStatus(getCardKey('work', item, idx)).isDue);
        }
        if (items.length === 0) {
          document.getElementById('workContainer').innerHTML = isReviewOnly
            ? `<div class="loading-hint">🎉 太棒了！职场沟通今日已全部复习完毕！</div>`
            : `<div class="loading-hint">暂无数据</div>`;
          return;
        }

        document.getElementById('workContainer').innerHTML = items.map((item, idx) => {
          const cardKey = getCardKey('work', item, idx);
          return `
            <div class="work-card">
              <div class="work-header">
                <strong>${item.topic}</strong>
                <span class="work-badge">职场高情商</span>
              </div>
              <p style="font-size: 0.85rem; color: var(--text-sub);">${item.scenario}</p>
              <div class="contrast-box">
                <div class="direct-bad">${item.directBad}</div>
                <div class="pro-good" onclick="playVoice('work', ${idx}, 'proGood', event)">
                  ${item.proGood} 🔊
                  <div style="font-size: 0.85rem; font-weight: normal; color: var(--text-sub); margin-top: 4px;">${item.proGoodZh}</div>
                </div>
              </div>
              <div class="work-formula">${item.formula}</div>
              ${renderEbhBar('work', cardKey)}
            </div>
          `;
        }).join('');
      }

      // 4. 雅思口语
      if (name === 'ielts' && appData.ielts) {
        if (isReviewOnly) {
          items = items.filter((item, idx) => getCardEbhStatus(getCardKey('ielts', item, idx)).isDue);
        }
        if (items.length === 0) {
          document.getElementById('ieltsContainer').innerHTML = isReviewOnly
            ? `<div class="loading-hint">🎉 太棒了！雅思口语今日已全部复习完毕！</div>`
            : `<div class="loading-hint">暂无数据</div>`;
          return;
        }

        document.getElementById('ieltsContainer').innerHTML = items.map((item, idx) => {
          const cardKey = getCardKey('ielts', item, idx);
          return `
            <div class="ielts-card">
              <div class="ielts-badge">${item.part}</div>
              <div class="prompt-box" onclick="playVoice('ielts', ${idx}, 'question', event)">Q: ${item.question} 🔊</div>
              <div class="ielts-script" onclick="playVoice('ielts', ${idx}, 'script', event)">
                ${item.script} 🔊
                <div style="margin-top: 6px; color: var(--text-sub); font-size: 0.85rem;">${item.translation}</div>
              </div>
              <div class="chunk-list">
                <strong>提分亮点：</strong>
                <ul style="margin-left: 16px; margin-top: 4px;">
                  ${(item.highlights || []).map(h => `<li>${h}</li>`).join('')}
                </ul>
              </div>
              ${renderEbhBar('ielts', cardKey)}
            </div>
          `;
        }).join('');
      }

      // 5. 商业破局
      if (name === 'biz' && appData.biz) {
        if (isReviewOnly) {
          items = items.filter((item, idx) => getCardEbhStatus(getCardKey('biz', item, idx)).isDue);
        }
        if (items.length === 0) {
          document.getElementById('bizContainer').innerHTML = isReviewOnly
            ? `<div class="loading-hint">🎉 太棒了！商业破局今日已全部复习完毕！</div>`
            : `<div class="loading-hint">暂无数据</div>`;
          return;
        }

        document.getElementById('bizContainer').innerHTML = items.map((item, idx) => {
          const cardKey = getCardKey('biz', item, idx);
          return `
            <div class="biz-card">
              <div><span class="biz-tag-trap">刁难情景</span></div>
              <div class="biz-question-box">${item.trap}</div>
              <div><span class="biz-tag-strategy">策略: ${item.strategy}</span></div>
              <div class="biz-response-box" onclick="playVoice('biz', ${idx}, 'responseEn', event)">
                <strong>回应话术：</strong><br>
                ${item.responseEn} 🔊
                <div style="margin-top: 4px; color: var(--text-sub); font-size: 0.85rem;">${item.responseZh}</div>
              </div>
              <div class="biz-punchline">${item.punchline}</div>
              ${renderEbhBar('biz', cardKey)}
            </div>
          `;
        }).join('');
      }

      // 6. TED 演说
      if (name === 'ted' && appData.ted) {
        if (isReviewOnly) {
          items = items.filter((item, idx) => getCardEbhStatus(getCardKey('ted', item, idx)).isDue);
        }
        if (items.length === 0) {
          document.getElementById('tedContainer').innerHTML = isReviewOnly
            ? `<div class="loading-hint">🎉 太棒了！TED演说今日已全部复习完毕！</div>`
            : `<div class="loading-hint">暂无数据</div>`;
          return;
        }

        document.getElementById('tedContainer').innerHTML = items.map((item, idx) => {
          const cardKey = getCardKey('ted', item, idx);
          return `
            <div class="ted-card">
              <div class="ted-header">
                <span class="ted-speaker">TED · ${item.speaker}</span>
                <span style="font-size: 0.85rem; color: var(--text-muted);">${item.sectionTitle}</span>
              </div>
              <div class="ted-split-layout">
                <div class="ted-script" onclick="playVoice('ted', ${idx}, 'scriptEn', event)">
                  ${item.scriptEn} 🔊
                  <div style="margin-top: 6px; color: var(--text-sub); font-size: 0.85rem;">${item.scriptZh}</div>
                </div>
                <div class="analysis-section">
                  <span class="tag-badge tag-exp">高阶语块</span>
                  <ul style="margin-left: 16px; margin-bottom: 6px;">
                    ${(item.expressions || []).map(exp => `<li>${exp}</li>`).join('')}
                  </ul>
                  <span class="tag-badge tag-strat">演说策略</span>
                  <p style="color: #4b5563; margin-bottom: 6px;">${item.strategy}</p>
                  <span class="tag-badge tag-trans">衔接手法</span>
                  <p style="color: #4b5563;">${item.transition}</p>
                </div>
              </div>
              ${renderEbhBar('ted', cardKey)}
            </div>
          `;
        }).join('');
      }
    }

    let availableVoices = [];
    let selectedVoice = null;

    function populateVoiceList() {
      if (!('speechSynthesis' in window)) return;
      const allVoices = window.speechSynthesis.getVoices();
      availableVoices = allVoices.filter(v => v.lang.startsWith('en'));
      const voiceSelect = document.getElementById('voiceSelect');
      voiceSelect.innerHTML = '';

      if (availableVoices.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = '默认系统音色';
        opt.value = '';
        voiceSelect.appendChild(opt);
        return;
      }

      const savedVoiceName = localStorage.getItem('mastery_preferred_voice');

      availableVoices.forEach(voice => {
        const opt = document.createElement('option');
        let label = voice.name;
        if (voice.name.includes('Natural') || voice.name.includes('Enhanced') || voice.name.includes('Google') || voice.name.includes('Siri')) {
          label += ' ⭐高品质';
        }
        opt.textContent = `${label} (${voice.lang})`;
        opt.value = voice.name;
        voiceSelect.appendChild(opt);
      });

      if (savedVoiceName && availableVoices.some(v => v.name === savedVoiceName)) {
        voiceSelect.value = savedVoiceName;
        selectedVoice = availableVoices.find(v => v.name === savedVoiceName);
      } else {
        const bestVoice = availableVoices.find(v => 
          v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Enhanced') || v.name.includes('Siri')
        ) || availableVoices[0];
        if (bestVoice) {
          voiceSelect.value = bestVoice.name;
          selectedVoice = bestVoice;
        }
      }
    }

    function onVoiceChange() {
      const voiceSelect = document.getElementById('voiceSelect');
      selectedVoice = availableVoices.find(v => v.name === voiceSelect.value);
      if (selectedVoice) {
        localStorage.setItem('mastery_preferred_voice', selectedVoice.name);
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoiceList;
      populateVoiceList();
    }

    function speakText(rawText) {
      if (!('speechSynthesis' in window)) return;
      const cleanText = rawText.replace(/<[^>]*>/g, '').replace(/&[a-z]+;/gi, ' ').trim();
      if (!cleanText) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'en-US';
      utterance.rate = 0.92;

      if (selectedVoice) utterance.voice = selectedVoice;
      setTimeout(() => window.speechSynthesis.speak(utterance), 10);
    }

    function playVoice(module, idx, field, evt) {
      if (evt) evt.stopPropagation(); // 阻止触发翻卡遮挡
      const items = getModuleList(module);
      if (!items[idx]) return;
      const targetText = items[idx][field];
      if (targetText) speakText(targetText);
    }

    function switchTab(tabKey) {
      document.querySelectorAll('.tab-chip').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(`pane-${tabKey}`).classList.add('active');

      if (!appData[tabKey]) {
        loadModule(tabKey);
      } else {
        renderModule(tabKey);
      }
    }

    function filterTabs(stage) {
      document.querySelectorAll('.stage-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const chips = document.querySelectorAll('.tab-chip');
      let firstVisible = null;

      chips.forEach(chip => {
        if (stage === 'all' || chip.dataset.stage === stage) {
          chip.style.display = 'inline-block';
          if (!firstVisible) firstVisible = chip;
        } else {
          chip.style.display = 'none';
        }
      });

      if (firstVisible) firstVisible.click();
    }

    ['vocab', 'daily', 'work', 'ielts', 'biz', 'ted'].forEach(loadModule);
  </script>
</body>
</html>
